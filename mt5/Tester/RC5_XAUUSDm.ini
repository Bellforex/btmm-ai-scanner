; Strategy Tester launch config — XAUUSDm
;
;   terminal64.exe /config:<abs path>/RC5_XAUUSDm.ini
;
; Model=0 is "Every tick based on real ticks" — the only model worth using for
; a first verification run, because entry timing and stop legality are what is
; being checked, not profitability.
;
; Report and journal names are per-symbol so three runs never overwrite one
; another's evidence.
;
; FromDate/ToDate MUST be set to the window actually under test and must be
; covered by the terminal's downloaded history; the values below are a
; placeholder, not a verified range.
;
; Deposit/Currency/Leverage are stated explicitly so a run is reproducible
; rather than inheriting whatever the terminal last used.
;
; SAFETY: InpAllowLiveExecution stays false in RC5_XAUUSDm.set. Because
; CanExecuteHere() requires MQL_TESTER or that second arm, this profile cannot
; arm a live account even if it is loaded onto a live chart.
[Tester]
Expert=RC5\RC5_EA
ExpertParameters=RC5_XAUUSDm.set
Symbol=XAUUSDm
Period=M15
Model=0
Optimization=0
FromDate=2026.08.01
ToDate=2026.09.20
ForwardMode=0
Deposit=10000
Currency=USD
Leverage=1:500
ExecutionMode=0
Visual=0
ShutdownTerminal=1
Report=RC5_report_XAUUSDm
ReplaceReport=1

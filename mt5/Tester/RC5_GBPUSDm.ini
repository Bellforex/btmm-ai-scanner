; Strategy Tester launch config — GBPUSDm
; terminal64.exe /config:RC5_GBPUSDm.ini
;
; Model=0 is "Every tick based on real ticks". Report and journal names are
; per-symbol so three runs never overwrite one another's evidence.
[Tester]
Expert=RC5\RC5_EA
ExpertParameters=RC5_GBPUSDm.set
Symbol=GBPUSDm
Period=M15
Model=0
Optimization=0
ShutdownTerminal=1
Visual=0
Report=RC5_report_GBPUSDm
ReplaceReport=1
Leverage=0
ExecutionMode=0

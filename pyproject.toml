[build-system]
requires = ["uv_build>=0.11.30,<0.12"]
build-backend = "uv_build"

[project]
name = "btmm-ai-scanner"
version = "0.1.0"
description = "Deterministic software foundation for the BTMM and POI AI scanner."
authors = [
    { name = "Bellforex" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.13.4,<2.14",
    "tzdata==2026.3",
]
license = "LicenseRef-Proprietary"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Private :: Do Not Upload",
]

[project.optional-dependencies]
# Only the HTTP service entry point (src/btmm_ai_scanner/service/) needs
# these — the deterministic analytical core (correlation/btrc/poi/scanner/
# structure/domain/measurements) stays dependency-free beyond pydantic, so
# it can still be embedded/tested without pulling in a web framework.
service = [
    "fastapi>=0.121,<0.122",
    "uvicorn[standard]>=0.38,<0.39",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "mypy>=2.3.0,<3",
    "ruff>=0.15.22,<0.16",
    # Only needed to drive FastAPI's TestClient in tests/unit/test_service_*
    # — the running service itself never imports httpx.
    "httpx>=0.28,<0.29",
]

[tool.uv]
required-version = "==0.11.30"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]
# "×" is the frozen POI cluster-count glyph in the user-facing visual naming
# contract (e.g. "M1 • BUY FVG ×3"), so RUF001/RUF002 flag it as a homoglyph
# for "x" in exactly the places it is required. See
# docs/architecture/BTRC_V1_POI_VISUAL_NAMING_CONTRACT.md.
allowed-confusables = ["×"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
show_error_codes = true
pretty = true

[tool.pytest]
minversion = "9.1"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
]
